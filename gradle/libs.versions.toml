# Nota sobre las versiones fijadas aquí (2026-09-20):
#
# compileSdk se queda en 36 en app/build.gradle.kts a propósito. Las
# versiones más nuevas de Compose y AndroidX (compose-bom 2026.08.00+,
# androidx.core:core-ktx 1.19.0+, androidx.activity:activity-compose 1.13.0+)
# ya exigen compilar contra la plataforma android-37, y esa plataforma
# todavía no está publicada en el repositorio del SDK
# (`sdkmanager --list` no la ofrece; solo existen sus build-tools).
#
# Por eso composeBom, coreKtx y activityCompose están fijados una versión
# por debajo de la última estable: son las últimas que siguen compilando
# contra android-36. Cuando el SDK Manager ofrezca platforms;android-37,
# subir compileSdk a 37 en app/build.gradle.kts y estas tres versiones a
# las últimas estables en la misma tanda, no por separado.
#
# navigationCompose (agregada 2026-09-26, ADR-0013) tiene la misma
# restricción: 2.10.x ya exige android-37, así que queda fijada en 2.9.8
# (la última de la serie 2.9.x) hasta esa misma tanda.

[versions]
agp = "9.4.1"
kotlin = "2.4.20"
coreKtx = "1.18.0"
activityCompose = "1.12.4"
composeBom = "2026.06.01"
navigationCompose = "2.9.8"
junit = "4.13.2"
androidxTestExtJunit = "1.3.0"
androidxTestRunner = "1.7.0"
mockitoCore = "5.23.0"
kotlinxCoroutines = "1.9.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
mockito-core = { group = "org.mockito", name = "mockito-core", version.ref = "mockitoCore" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
